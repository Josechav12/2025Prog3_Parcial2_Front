<!DOCTYPE html>

<head>

</head>

<!-- Body -->
<body>

        <h3 id="nav-titulo">Electroniks</h3>

    <main>

            </form>
        </div>

        <section id="contenedor-carrito"></section>
    </main>
    <footer>
        <h3 id="footer-nombres">Jose / Lautaro </h3>
